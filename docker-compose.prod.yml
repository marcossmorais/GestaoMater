# Mater — produção (VPS). Desenvolvimento continua no docker-compose.yml.
#
#   cp .env.production.example .env   # preencher
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec app php database/migrate.php
#
# Diferenças do dev: código dentro da imagem (sem montar a pasta), sem dados fictícios,
# banco e app sem porta publicada (só o Caddy, com HTTPS), erros fora da tela, OPcache sem reler arquivos,
# e o banco é criado/atualizado pelo database/migrate.php (não pelo initdb).
name: mater

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mater}
      POSTGRES_USER: ${DB_USER:-mater}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-mater} -d ${DB_NAME:-mater}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: mater-app:prod
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mater}
      DB_USER: ${DB_USER:-mater}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      # rede interna do docker, sem sair da VPS; banco externo (Supabase) exige require
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      APP_URL: ${APP_URL:?defina APP_URL no .env (https://seu-dominio)}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?defina CLERK_PUBLISHABLE_KEY no .env}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?defina CLERK_SECRET_KEY no .env}
      APP_SIGNING_KEY: ${APP_SIGNING_KEY:?defina APP_SIGNING_KEY no .env (openssl rand -hex 32)}
      SCHOOL_NAME: ${SCHOOL_NAME:-MATER Colégio e Curso}
      SCHOOL_LEGAL_INFO: ${SCHOOL_LEGAL_INFO:-}
      SCHOOL_ADDRESS: ${SCHOOL_ADDRESS:-}
      SCHOOL_CITY: ${SCHOOL_CITY:-}
      PHP_DISPLAY_ERRORS: "Off"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
      PHP_SESSION_COOKIE_SECURE: "1"
    volumes:
      # o que é enviado pelo sistema sobrevive a cada deploy (e entra no backup)
      - storage:/var/www/html/storage
      - photos-admin:/var/www/html/public/assets/img/adminProfilePhotos
      - photos-student:/var/www/html/public/assets/img/studentProfilePhotos
      - photos-teacher:/var/www/html/public/assets/img/teacherProfilePhotos
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?defina APP_DOMAIN no .env (portal.colegio.com.br, sem https)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  pg-data:
  storage:
  photos-admin:
  photos-student:
  photos-teacher:
  caddy-data:
  caddy-config:
