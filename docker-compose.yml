services:
  db:
    image: postgres:17-alpine
    container_name: mater-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mater}
      POSTGRES_USER: ${DB_USER:-mater}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mater}
    ports:
      - "5433:5432"
    volumes:
      - mater-pg-data:/var/lib/postgresql/data
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./database/03_auth.sql:/docker-entrypoint-initdb.d/03_auth.sql:ro
      - ./database/04_indexes.sql:/docker-entrypoint-initdb.d/04_indexes.sql:ro
      - ./database/05_chamada.sql:/docker-entrypoint-initdb.d/05_chamada.sql:ro
      - ./database/06_grade_horario.sql:/docker-entrypoint-initdb.d/06_grade_horario.sql:ro
      - ./database/07_atestado_falta.sql:/docker-entrypoint-initdb.d/07_atestado_falta.sql:ro
      - ./database/08_ocorrencias.sql:/docker-entrypoint-initdb.d/08_ocorrencias.sql:ro
      - ./database/09_responsaveis_portaria.sql:/docker-entrypoint-initdb.d/09_responsaveis_portaria.sql:ro
      - ./database/10_auditoria.sql:/docker-entrypoint-initdb.d/10_auditoria.sql:ro
      - ./database/11_etapa_turma.sql:/docker-entrypoint-initdb.d/11_etapa_turma.sql:ro
      - ./database/12_diario_aula.sql:/docker-entrypoint-initdb.d/12_diario_aula.sql:ro
      - ./database/13_mural_roteiro.sql:/docker-entrypoint-initdb.d/13_mural_roteiro.sql:ro
      - ./database/14_desempenho_cronograma.sql:/docker-entrypoint-initdb.d/14_desempenho_cronograma.sql:ro
      - ./database/15_documentos_assinados.sql:/docker-entrypoint-initdb.d/15_documentos_assinados.sql:ro
      - ./database/16_regra_bimestral.sql:/docker-entrypoint-initdb.d/16_regra_bimestral.sql:ro
      - ./database/dev/99_dev_seed.sql:/docker-entrypoint-initdb.d/99_dev_seed.sql:ro
      - ./database/dev/99b_dev_grade_horario.sql:/docker-entrypoint-initdb.d/99b_dev_grade_horario.sql:ro
      - ./database/dev/99c_dev_07_atestado_falta.sql:/docker-entrypoint-initdb.d/99c_dev_07_atestado_falta.sql:ro
      - ./database/dev/99c_dev_08_ocorrencias.sql:/docker-entrypoint-initdb.d/99c_dev_08_ocorrencias.sql:ro
      - ./database/dev/99c_dev_09_responsaveis_portaria.sql:/docker-entrypoint-initdb.d/99c_dev_09_responsaveis_portaria.sql:ro
      - ./database/dev/99d_dev_anos_iniciais.sql:/docker-entrypoint-initdb.d/99d_dev_anos_iniciais.sql:ro
      - ./database/dev/99e_dev_cronograma.sql:/docker-entrypoint-initdb.d/99e_dev_cronograma.sql:ro
      - ./database/dev/99f_dev_bimestral.sql:/docker-entrypoint-initdb.d/99f_dev_bimestral.sql:ro
      - ./database/dev/99g_dev_tres_avaliacoes.sql:/docker-entrypoint-initdb.d/99g_dev_tres_avaliacoes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER:-mater} -d ${DB_NAME:-mater}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mater-app
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-mater}
      DB_USER: ${DB_USER:-mater}
      DB_PASSWORD: ${DB_PASSWORD:-mater}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      PHP_DISPLAY_ERRORS: ${PHP_DISPLAY_ERRORS:-On}
      PHP_OPCACHE_REVALIDATE_FREQ: ${PHP_OPCACHE_REVALIDATE_FREQ:-2}
      APP_URL: ${APP_URL:-http://localhost:8000}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      # dev: chave fixa só para ambiente local; em produção defina APP_SIGNING_KEY no .env
      APP_SIGNING_KEY: ${APP_SIGNING_KEY:-dev-only-signing-key-change-me-in-production-0000}
      SCHOOL_NAME: ${SCHOOL_NAME:-MATER Colégio e Curso}
      SCHOOL_LEGAL_INFO: ${SCHOOL_LEGAL_INFO:-}
      SCHOOL_ADDRESS: ${SCHOOL_ADDRESS:-}
      SCHOOL_CITY: ${SCHOOL_CITY:-}
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  mater-pg-data:
